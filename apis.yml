name: Indoo Rs
description: >-
  indoo.rs (indoo.rs GmbH) was a Vienna, Austria based Indoor Positioning System
  (IPS) startup founded in 2010 that built indoor mapping, localization, and
  routing technology plus a mobile SDK for developers and device manufacturers.
  Its solution combined Wi-Fi, BLE/iBeacon, sensor fusion, and dead-reckoning
  (SLAM-style) navigation to deliver real-time indoor positioning with accuracy
  down to roughly two meters. Backed early by Speedinvest, indoo.rs was acquired
  by Esri on February 28, 2019; its software became part of Esri's ArcGIS Indoors
  and its Vienna headquarters became the Esri R&D Center Vienna focused on IPS.
  The indoo.rs domain now redirects to the ArcGIS Indoors product, and the company
  no longer operates an independent public API or developer portal. This profile
  was surfaced as a Speedinvest portfolio company and enriched from public sources.
